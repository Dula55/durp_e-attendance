# fly.toml configuration file for attendance app

app = "attendance-app2"  # Match your actual app name

primary_region = "lax"

kill_signal = "SIGINT"
kill_timeout = 5

[http_service]
  internal_port = 8000  # Changed from 8080 to match your app
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[services]]
  http_checks = []
  internal_port = 8000  # Changed from 8080

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    grace_period = "1s"
    interval = "15s"
    restart_limit = 0
    timeout = "2s"

[env]
  SESSION_COOKIE_SECURE = "True"
  SESSION_COOKIE_SAMESITE = "Lax"
  LOG_LEVEL = "INFO"
  FLASK_DEBUG = "False"
  PORT = "8000"  # Explicitly set PORT for Flask

# For persistent storage with SQLite
[mounts]
  source = "data"
  destination = "/app/data"