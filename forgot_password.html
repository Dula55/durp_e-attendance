<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>NSUK URP E-Attendance System - Forgot Password</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0f1b3d",
                        "primary-hover": "#0a1430",
                        "background-light": "#f8fafc",
                        "background-dark": "#0f172a",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1e293b",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.75rem", "lg": "1rem", "xl": "1.5rem"},
                },
            },
        }
    </script>
    
    <style>
        body { min-height: 100vh; font-family: 'Lexend', sans-serif; }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white font-display">
    <!-- Navigation Bar -->
    <nav class="bg-surface-light dark:bg-surface-dark shadow-md">
        <div class="container mx-auto px-4 py-3">
            <div class="flex justify-between items-center">
                <a href="{{ url_for('index') }}" class="flex items-center space-x-3">
                    <img src="{{ url_for('static', filename='NSUK-logo.jpg') }}" alt="NSUK Logo" class="h-10 w-10 rounded-lg object-cover">
                    <div>
                        <h1 class="text-lg font-bold text-primary dark:text-white">NSUK URP</h1>
                        <p class="text-xs text-slate-600 dark:text-slate-400">E-Attendance System</p>
                    </div>
                </a>
                
                <button onclick="toggleTheme()" class="p-2 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700">
                    <span id="themeIcon" class="material-symbols-outlined text-slate-700 dark:text-slate-300">dark_mode</span>
                </button>
            </div>
        </div>
    </nav>

    <div id="flashMessages" class="container mx-auto px-4 py-4"></div>

    <main class="container mx-auto px-4 py-8">
        <div class="max-w-md mx-auto">
            <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-lg p-8 fade-in">
                <div class="text-center mb-6">
                    <span class="material-symbols-outlined text-primary text-5xl mb-2">lock_reset</span>
                    <h2 class="text-2xl font-bold">Reset Password</h2>
                    <p class="text-slate-500 text-sm mt-1">Enter your username to receive reset instructions</p>
                </div>

                <form id="forgotPasswordForm" class="space-y-5">
                    <div>
                        <label class="block text-sm font-semibold mb-1">Username / Matric No.</label>
                        <input type="text" id="resetUsername" required class="w-full rounded-xl border-slate-300 focus:border-primary focus:ring-primary" placeholder="Enter your username or matric number">
                    </div>

                    <button type="submit" class="w-full bg-primary hover:bg-primary-hover text-white py-3 rounded-xl font-semibold transition">
                        <span class="material-symbols-outlined align-middle mr-1">send</span>Send Reset Instructions
                    </button>
                </form>

                <div class="mt-6 text-center">
                    <a href="{{ url_for('login') }}" class="text-sm text-primary hover:underline">
                        <span class="material-symbols-outlined align-middle text-sm">arrow_back</span> Back to Login
                    </a>
                </div>
            </div>

            <!-- Reset Password Form (Hidden initially) -->
            <div id="resetPasswordSection" class="bg-white dark:bg-slate-800 rounded-2xl shadow-lg p-8 mt-6 hidden">
                <h3 class="text-xl font-bold mb-4 text-center">Set New Password</h3>
                <form id="resetPasswordForm" class="space-y-5">
                    <input type="hidden" id="resetToken">
                    
                    <div>
                        <label class="block text-sm font-semibold mb-1">New Password</label>
                        <div class="relative">
                            <input type="password" id="newPassword" required minlength="8" class="w-full rounded-xl border-slate-300 focus:border-primary focus:ring-primary pr-12" placeholder="Enter new password">
                            <button type="button" onclick="togglePassword('newPassword', 'newPasswordToggle')" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-slate-500">
                                <span id="newPasswordToggle" class="material-symbols-outlined">visibility_off</span>
                            </button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold mb-1">Confirm New Password</label>
                        <div class="relative">
                            <input type="password" id="confirmNewPassword" required minlength="8" class="w-full rounded-xl border-slate-300 focus:border-primary focus:ring-primary pr-12" placeholder="Confirm new password">
                            <button type="button" onclick="togglePassword('confirmNewPassword', 'confirmNewPasswordToggle')" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-slate-500">
                                <span id="confirmNewPasswordToggle" class="material-symbols-outlined">visibility_off</span>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-primary hover:bg-primary-hover text-white py-3 rounded-xl font-semibold transition">
                        Reset Password
                    </button>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-surface-light dark:bg-surface-dark border-t border-slate-200 dark:border-slate-800 mt-12">
        <div class="container mx-auto px-4 py-8">
            <div class="text-center">
                <p class="text-sm text-slate-600 dark:text-slate-400">
                    Department of Urban and Regional Planning<br>
                    Nasarawa State University, Keffi
                </p>
            </div>
        </div>
    </footer>

    <script>
        // Set theme
        const savedTheme = localStorage.getItem('theme');
        const themeIcon = document.getElementById('themeIcon');
        
        if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
            themeIcon.textContent = 'light_mode';
        } else {
            document.documentElement.classList.add('light');
            themeIcon.textContent = 'dark_mode';
        }

        function toggleTheme() {
            const html = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
                themeIcon.textContent = 'dark_mode';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                themeIcon.textContent = 'light_mode';
                localStorage.setItem('theme', 'dark');
            }
        }

        function togglePassword(inputId, toggleId) {
            const input = document.getElementById(inputId);
            const toggle = document.getElementById(toggleId);
            
            if (input.type === 'password') {
                input.type = 'text';
                toggle.textContent = 'visibility';
            } else {
                input.type = 'password';
                toggle.textContent = 'visibility_off';
            }
        }

        function showFlashMessage(message, type = 'info') {
            const flashMessages = document.getElementById('flashMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `rounded-xl p-4 mb-3 fade-in ${
                type === 'success' ? 'bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-900 text-green-800 dark:text-green-300' :
                type === 'error' ? 'bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-900 text-red-800 dark:text-red-300' :
                'bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-900 text-blue-800 dark:text-blue-300'
            }`;
            messageDiv.textContent = message;
            flashMessages.appendChild(messageDiv);
            
            setTimeout(() => {
                if (messageDiv.parentNode) {
                    messageDiv.style.opacity = '0';
                    messageDiv.style.transition = 'opacity 0.5s';
                    setTimeout(() => {
                        if (messageDiv.parentNode) {
                            messageDiv.parentNode.removeChild(messageDiv);
                        }
                    }, 500);
                }
            }, 5000);
        }

        // Forgot password form submission
        document.getElementById('forgotPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('resetUsername').value;
            
            try {
                const response = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showFlashMessage(data.message, 'success');
                    
                    // For demo purposes, show reset form with token
                    if (data.demo_token) {
                        document.getElementById('resetToken').value = data.demo_token;
                        document.getElementById('resetPasswordSection').classList.remove('hidden');
                    }
                } else {
                    showFlashMessage(data.message, 'error');
                }
            } catch (error) {
                showFlashMessage('An error occurred. Please try again.', 'error');
            }
        });

        // Reset password form submission
        document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const token = document.getElementById('resetToken').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmNewPassword').value;
            
            if (newPassword !== confirmPassword) {
                showFlashMessage('Passwords do not match', 'error');
                return;
            }
            
            try {
                const response = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ token, password: newPassword })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showFlashMessage(data.message, 'success');
                    setTimeout(() => {
                        window.location.href = '{{ url_for("login") }}';
                    }, 1500);
                } else {
                    showFlashMessage(data.message, 'error');
                }
            } catch (error) {
                showFlashMessage('An error occurred. Please try again.', 'error');
            }
        });
    </script>
</body>
</html>
